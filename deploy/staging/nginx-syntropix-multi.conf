# Full nginx config for EC2 — AegisOps stack subdomains
# Install:
#   sudo cp deploy/staging/nginx-syntropix-multi.conf /etc/nginx/sites-available/syntropix-multi.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/syntropix-multi.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then SSL (if not done):
#   sudo certbot --nginx -d spotting.syntropix.io -d api.spotting.syntropix.io -d monitoring.syntropix.io
#
# Verify (should NOT show "Welcome to nginx"):
#   curl -s http://127.0.0.1/healthz -H "Host: api.spotting.syntropix.io"
#   curl -s https://api.spotting.syntropix.io/healthz

# --- Spotting API (port 3000) — NEXT_PUBLIC_SPOTTING_API_URL ---
server {
    listen 80;
    server_name api.spotting.syntropix.io;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Spotting web UI (port 3001) ---
server {
    listen 80;
    server_name spotting.syntropix.io;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- DevOps Copilot (port 5000) ---
server {
    listen 80;
    server_name monitoring.syntropix.io;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Certbot will add listen 443 ssl blocks here after --nginx runs.
# If HTTPS still shows "Welcome to nginx", certbot may have created a separate
# file without proxy_pass — delete it and re-run certbot on this file only.
