name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kkjayakumar/aegisops
  # EC2 staging host is aarch64 (uname -m → aarch64)
  IMAGE_PLATFORM: linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegisops
          POSTGRES_PASSWORD: aegisops
          POSTGRES_DB: aegisops
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aegisops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web console
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Go test
        env:
          DATABASE_URL: postgres://aegisops:aegisops@localhost:5433/aegisops?sslmode=disable
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p bin
          go build -o bin/aegisops ./cmd/aegisops
          go build -o bin/aegisops-mcp ./cmd/aegisops-mcp

  # Build + push image only after merge to main (not on PRs). Deploy workflow follows CI success on main push.
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify manifest
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:latest" \
            | grep -E 'Platform:|linux/arm64'

      - name: Publish summary
        run: |
          {
            echo "### Published Docker Image"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Image | \`${{ env.IMAGE_NAME }}:${IMAGE_TAG}\` |"
            echo "| Latest | \`${{ env.IMAGE_NAME }}:latest\` |"
            echo "| Platform | \`${{ env.IMAGE_PLATFORM }}\` (EC2 aarch64) |"
          } >> "$GITHUB_STEP_SUMMARY"
