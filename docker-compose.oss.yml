# Syntropix Console — Community Edition (Postgres + app only).
# Optional: run DevOps Copilot (:5000) and Spotting (:3000) on the host for full telemetry.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegisops
      POSTGRES_PASSWORD: aegisops
      POSTGRES_DB: aegisops
    ports:
      - "5433:5432"
    volumes:
      - aegisops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisops"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  aegisops:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AEGISOPS_ENV: ${AEGISOPS_ENV:-development}
    env_file:
      - .env
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      AEGISOPS_EDITION: community
      AEGISOPS_ENV: ${AEGISOPS_ENV:-development}
      DATABASE_URL: postgres://aegisops:aegisops@postgres:5432/aegisops?sslmode=disable
      AEGISOPS_PUBLIC_URL: ${AEGISOPS_PUBLIC_URL:-http://localhost:5001}
      COPILOT_API_URL: ${COPILOT_API_URL:-http://host.docker.internal:5000}
      SPOTTING_API_URL: ${SPOTTING_API_URL:-http://host.docker.internal:3000}
      AEGISOPS_REQUIRE_GATEWAY: ${AEGISOPS_REQUIRE_GATEWAY:-false}
      WORKSPACE_SECRETS_KEY: ${WORKSPACE_SECRETS_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aegisops_pg:
